---
- name: IniTest
  element:
  - name: foo
    type: list
    cargo:
      type: leaf
      value_type: uniline
  - name: bar
    alias: foo
  - name: baz
    type: leaf
    value_type: uniline
  - name: class1
    type: node
    config_class_name: IniTest::Class
  - name: class2
    alias: class1
  rw_config:
    auto_create: 1
    auto_delete: 1
    backend: IniFile
    config_dir: /etc/
    file: test.ini
- name: IniTest2
  element:
  - name: foo
    type: list
    cargo:
      type: leaf
      value_type: uniline
  - name: bar
    alias: foo
  - name: baz
    type: leaf
    value_type: uniline
  - name: class1
    type: node
    config_class_name: IniTest::Class
  - name: class2
    alias: class1
  rw_config:
    auto_create: 1
    backend: IniFile
    comment_delimiter: ;
    config_dir: /etc/
    file: test.ini
- name: IniTest3
  element:
  - name: foo
    type: list
    cargo:
      type: leaf
      value_type: uniline
  - name: bar
    alias: foo
  - name: baz
    type: leaf
    value_type: uniline
  - name: class1
    type: node
    config_class_name: IniTest::Class
  - name: class2
    alias: class1
  rw_config:
    auto_create: 1
    backend: IniFile
    comment_delimiter: '#;'
    config_dir: /etc/
    file: test.ini
- name: IniTest::Class
  element:
  - name: lista
    type: list
    cargo:
      type: leaf
      value_type: uniline
  - name: listb
    alias: lista
- name: AutoIni
  accept:
  - pattern: class.*
    type: node
    config_class_name: AutoIniClass
  - pattern: .*
    type: list
    cargo:
      type: leaf
      value_type: uniline
  rw_config:
    auto_create: 1
    backend: IniFile
    config_dir: /etc/
    file: test.ini
- name: AutoIniClass
  accept:
  - pattern: .*
    type: list
    cargo:
      type: leaf
      value_type: uniline
- name: MyClass
  element:
  - name: foo
    type: list
    cargo:
      type: leaf
      value_type: uniline
  - name: bar
    alias: foo
  - name: baz
    type: leaf
    value_type: uniline
  - name: any_ini_class
    type: hash
    cargo:
      config_class_name: AutoIniClass
      type: node
    index_type: string
  rw_config:
    auto_create: 1
    backend: IniFile
    config_dir: /etc/
    file: test.ini
    store_class_in_hash: any_ini_class
- name: IniCheck
  element:
  - name: foo
    type: check_list
    choice:
    - foo1
    - foo2
    - bar1
  - name: bar
    alias: foo
  - name: baz
    type: leaf
    value_type: uniline
  - name: class1
    type: node
    config_class_name: IniCheckList::Class
  - name: class2
    alias: class1
  rw_config:
    auto_create: 1
    backend: IniFile
    file: test.ini
- name: IniCheckList::Class
  element:
  - name: lista
    type: check_list
    choice:
    - lista1
    - lista2
    - lista3
    - nolist
- name: IniDQuotes
  element:
  - name: baz
    type: leaf
    value_type: string
  - name: a_list
    type: list
    cargo:
      type: leaf
      value_type: uniline
  rw_config:
    auto_create: 1
    backend: IniFile
    file: test.ini
    quote_value: shell_style
